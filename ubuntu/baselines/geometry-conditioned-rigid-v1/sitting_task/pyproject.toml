[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "humanoid-sitting-task"
version = "0.1.0"
description = "Fixed rigid seat task for Unitree G1 using Isaac Lab 3.0"
requires-python = ">=3.12,<3.13"
dependencies = ["isaaclab", "isaaclab-assets", "isaaclab-rl", "isaaclab-tasks"]

[project.entry-points."isaaclab.tasks"]
humanoid_sitting = "humanoid_sitting.tasks"

[tool.uv.build-backend]
module-name = "humanoid_sitting"

[tool.ruff]
line-length = 120
target-version = "py312"
